id: source_to_target_scd2_derived
description: Shared derived SCD2 pattern for source-to-target table mappings where effective dating is derived from source data.
control_data:
  materialisation_type: table
  change_type: scd2_derived
  validation_enabled: true
  failure_mode: fail_load
  staging_schema: INTERMEDIATE
  scd:
    scd2_validation_enabled: true
    scd2_validation: continuous
source:
  format: table
target:
  schema: CORE
  fields:
    - id: AUDIT_CREATED_SOURCE
      source:
        fixed_value: DBT
      data_type: varchar(16777216)
      nullable: false

    - id: AUDIT_LAST_CHANGED_SOURCE
      source:
        fixed_value: DBT
      data_type: varchar(16777216)
      nullable: false
