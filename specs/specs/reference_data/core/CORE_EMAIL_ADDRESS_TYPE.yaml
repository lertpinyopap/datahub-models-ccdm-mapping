id: reference_core_email_address_type
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference email address type CSV data into a manual SCD2 email address type table.
control_data:
  business_key:
    fields:
      - EMAIL_ADDRESS_TYPE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.EMAIL_ADDRESS_TYPE.csv
    name: reference_core_email_address_type_seed
    schema: INTERMEDIATE
target:
  id: EMAIL_ADDRESS_TYPE
  schema: CORE
  table_name: EMAIL_ADDRESS_TYPE
  fields:
    - id: EMAIL_ADDRESS_TYPE_CODE
      source:
        pos: 0
        column: EMAIL_ADDRESS_TYPE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: EMAIL_ADDRESS_TYPE_DESCRIPTION
      source:
        pos: 1
        column: EMAIL_ADDRESS_TYPE_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
