id: reference_core_customer_status
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference customer status CSV data into a manual SCD2 customer status table.
control_data:
  business_key:
    fields:
      - CUSTOMER_STATUS_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CUSTOMER_STATUS.csv
    name: reference_core_customer_status_seed
    schema: INTERMEDIATE
target:
  id: CUSTOMER_STATUS
  schema: CORE
  table_name: CUSTOMER_STATUS
  fields:
    - id: CUSTOMER_STATUS_CODE
      source:
        pos: 0
        column: CUSTOMER_STATUS_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CUSTOMER_STATUS_DESCRIPTION
      source:
        pos: 1
        column: CUSTOMER_STATUS_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
