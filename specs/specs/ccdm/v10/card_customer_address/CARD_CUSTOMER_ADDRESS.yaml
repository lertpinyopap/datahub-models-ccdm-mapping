id: card_customer_address
extends: SOURCE_TO_TARGET_SCD2_DERIVED
description: Maps V10 customer home and business addresses into CORE.CARD_CUSTOMER_ADDRESS.
control_data:
  business_key:
    fields:
      - CARD_CUSTOMER_BUSINESS_KEY
      - ADDRESS_TYPE_KEY
      - ADDRESS_LINE1
      - ADDRESS_LINE2
      - POSTAL_CODE
  business_data_hash:
    business_data_hash_mode: include
    fields:
      - ADDRESS_COUNTRY_KEY
      - CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      - BUILDING_NUMBER
      - BUILDING_NAME
      - STREET_NAME
      - ADDRESS_LINE1
      - ADDRESS_LINE2
      - ADDRESS_LINE3
      - ADDRESS_LINE4
      - TOWN_NAME
      - REGION
      - POSTAL_CODE
  scd:
    derivation_scope: affected_keys
    validation_scope: affected_window
    window_strategy: previous_and_next
    current_flag:
      mode: latest_per_business_key
    deleted_flag:
      mode: fixed
      value: N
source:
  format: table
  query: |
    with address_rows as (
      select C.AMNA_ACCT as CUSTOMER_ID, 'HOME' as ADDRESS_TYPE_CODE,
        C.AMNA_CNTRY_CD_01 as COUNTRY_CODE, 'PREFERRED' as PREFERENCE_CODE,
        C.AMNA_HOUSE_NUMBER_01 as BUILDING_NUMBER, C.AMNA_HOUSE_NAME_01 as BUILDING_NAME,
        cast(null as varchar) as STREET_NAME, C.AMNA_ADDR_1_01 as ADDRESS_LINE1,
        C.AMNA_ADDR_2_01 as ADDRESS_LINE2, C.AMNA_ADDR_3_01 as ADDRESS_LINE3,
        C.AMNA_ADDR_4_01 as ADDRESS_LINE4, C.AMNA_CITY_STATE_01 as TOWN_NAME,
        C.AMNA_STATE_01 as REGION, C.AMNA_PSTL_CD_01 as POSTAL_CODE,
        cast(C.AMNA_DATE_LAST_MAINT as timestamp_ntz) as SOURCE_EFFECTIVE_FROM_DATETIME
      from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER as C
      union all
      select C.AMNA_ACCT, 'HOME', C.AMNA_CNTRY_CD_02, 'PREFERRED', C.AMNA_HOUSE_NUMBER_02, C.AMNA_HOUSE_NAME_02,
        cast(null as varchar), C.AMNA_ADDR_1_02, C.AMNA_ADDR_2_02, C.AMNA_ADDR_3_02, C.AMNA_ADDR_4_02,
        C.AMNA_CITY_STATE_02, C.AMNA_STATE_02, C.AMNA_PSTL_CD_02, cast(C.AMNA_DATE_LAST_MAINT as timestamp_ntz)
      from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER as C
      union all
      select C.AMNA_ACCT, 'BIZZ', 'DQNotApplicable', 'NOCTCT', cast(null as varchar), cast(null as varchar),
        cast(null as varchar), C.AMNA_EMPLOYER_ADDR_1_01, C.AMNA_EMPLOYER_ADDR_2_01, cast(null as varchar),
        cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(C.AMNA_DATE_LAST_MAINT as timestamp_ntz)
      from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER as C
      union all
      select C.AMNA_ACCT, 'BIZZ', 'DQNotApplicable', 'NOCTCT', cast(null as varchar), cast(null as varchar),
        cast(null as varchar), C.AMNA_EMPLOYER_ADDR_1_02, C.AMNA_EMPLOYER_ADDR_2_02, cast(null as varchar),
        cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(C.AMNA_DATE_LAST_MAINT as timestamp_ntz)
      from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER as C
    ), card_customer as (
      select CUSTOMER_ID, CARD_CUSTOMER_KEY, CARD_CUSTOMER_BUSINESS_KEY
      from {{ var("database") }}.CORE.CARD_CUSTOMER
      where IS_CURRENT_FLAG = 'Y'
      qualify row_number() over (partition by CUSTOMER_ID order by AUDIT_LAST_CHANGED_DATETIME desc nulls last) = 1
    )
    select C.CARD_CUSTOMER_KEY, C.CARD_CUSTOMER_BUSINESS_KEY, A.*
    from address_rows A join card_customer C on C.CUSTOMER_ID = A.CUSTOMER_ID
    where coalesce(trim(A.ADDRESS_LINE1), trim(A.ADDRESS_LINE2), trim(A.POSTAL_CODE)) is not null
target:
  id: CARD_CUSTOMER_ADDRESS
  schema: CORE
  fields:
    - id: CARD_CUSTOMER_KEY
      source:
        column: CARD_CUSTOMER_KEY
      data_type: varchar(64)
      nullable: false
    - id: CARD_CUSTOMER_BUSINESS_KEY
      source:
        column: CARD_CUSTOMER_BUSINESS_KEY
      data_type: varchar(64)
      nullable: false
    - id: ADDRESS_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: ADDRESS_TYPE
          source_system: V10
          source_code_column: ADDRESS_TYPE_CODE
          required: true
      data_type: varchar(64)
      nullable: false
    - id: ADDRESS_COUNTRY_KEY
      source:
        macro: reference_lookup_core_macros.reference_lookup_core_bridge
        args:
          reference_type: COUNTRY
          source_code_column: COUNTRY_CODE
          code_column: COUNTRY_CODE
          value_column: COUNTRY_KEY
          required: true
      data_type: varchar(64)
      nullable: true
    - id: CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: CUSTOMER_CONTACT_PREFERENCE_TYPE
          source_system: V10
          source_code_column: PREFERENCE_CODE
          required: true
      data_type: varchar(64)
      nullable: false
    - id: BUILDING_NUMBER
      source:
        column: BUILDING_NUMBER
      data_type: varchar(100)
      nullable: true
    - id: BUILDING_NAME
      source:
        column: BUILDING_NAME
      data_type: varchar(100)
      nullable: true
    - id: STREET_NAME
      source:
        column: STREET_NAME
      data_type: varchar(100)
      nullable: true
    - id: ADDRESS_LINE1
      source:
        column: ADDRESS_LINE1
      data_type: varchar(100)
      nullable: true
    - id: ADDRESS_LINE2
      source:
        column: ADDRESS_LINE2
      data_type: varchar(100)
      nullable: true
    - id: ADDRESS_LINE3
      source:
        column: ADDRESS_LINE3
      data_type: varchar(100)
      nullable: true
    - id: ADDRESS_LINE4
      source:
        column: ADDRESS_LINE4
      data_type: varchar(100)
      nullable: true
    - id: TOWN_NAME
      source:
        column: TOWN_NAME
      data_type: varchar(100)
      nullable: true
    - id: REGION
      source:
        column: REGION
      data_type: varchar(100)
      nullable: true
    - id: POSTAL_CODE
      source:
        column: POSTAL_CODE
      data_type: varchar(100)
      nullable: true
    - id: VALID_FROM_DATETIME
      source:
        column: SOURCE_EFFECTIVE_FROM_DATETIME
      data_type: timestamp_ntz
      nullable: false
