id: reference_core_phone_number_type
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference phone number type CSV data into a manual SCD2 phone number type table.
control_data:
  business_key:
    fields:
      - PHONE_NUMBER_TYPE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.PHONE_NUMBER_TYPE.csv
    name: reference_core_phone_number_type_seed
    schema: INTERMEDIATE
target:
  id: PHONE_NUMBER_TYPE
  schema: CORE
  table_name: PHONE_NUMBER_TYPE
  fields:
    - id: PHONE_NUMBER_TYPE_CODE
      source:
        pos: 0
        column: PHONE_NUMBER_TYPE_CODE
      data_type: varchar(100)
      transforms:
        - type: trim
      nullable: false
    - id: PHONE_NUMBER_TYPE_DESCRIPTION
      source:
        pos: 1
        column: PHONE_NUMBER_TYPE_DESCRIPTION
      data_type: varchar(1000)
      transforms:
        - type: trim
      nullable: false
