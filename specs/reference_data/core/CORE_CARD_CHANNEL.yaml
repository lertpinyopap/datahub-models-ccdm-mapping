id: reference_core_card_channel
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference card channel CSV data into a manual SCD2 card channel table.
control_data:
  business_key:
    fields:
      - CARD_CHANNEL_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CARD_CHANNEL.csv
    name: reference_core_card_channel_seed
    schema: INTERMEDIATE
target:
  id: CARD_CHANNEL
  schema: CORE
  table_name: CARD_CHANNEL
  fields:
    - id: CARD_CHANNEL_CODE
      source:
        pos: 0
        column: CARD_CHANNEL_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CARD_CHANNEL_DESCRIPTION
      source:
        pos: 1
        column: CARD_CHANNEL_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
