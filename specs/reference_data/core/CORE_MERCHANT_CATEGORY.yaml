id: reference_core_merchant_category
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference merchant category CSV data into a manual SCD2 merchant category table.
control_data:
  business_key:
    fields:
      - MERCHANT_CATEGORY_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.MERCHANT_CATEGORY.csv
    name: reference_core_merchant_category_seed
    schema: INTERMEDIATE
target:
  id: MERCHANT_CATEGORY
  schema: CORE
  table_name: MERCHANT_CATEGORY
  fields:
    - id: MERCHANT_CATEGORY_CODE
      source:
        pos: 0
        column: MERCHANT_CATEGORY_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: MERCHANT_CATEGORY_DESCRIPTION
      source:
        pos: 1
        column: MERCHANT_CATEGORY_DESCRIPTION
      data_type: varchar(1000)
      transforms:
        - type: trim
      nullable: false
