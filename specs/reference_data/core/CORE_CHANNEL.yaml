id: reference_core_channel
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference channel CSV data into a manual SCD2 channel table.
control_data:
  business_key:
    fields:
      - CHANNEL_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CHANNEL.csv
    name: reference_core_channel_seed
    schema: INTERMEDIATE
target:
  id: CHANNEL
  schema: CORE
  table_name: CHANNEL
  fields:
    - id: CHANNEL_CODE
      source:
        pos: 0
        column: CHANNEL_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CHANNEL_DESCRIPTION
      source:
        pos: 1
        column: CHANNEL_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
    - id: CHANNEL_TYPE_CODE
      source:
        pos: 2
        column: CHANNEL_TYPE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
