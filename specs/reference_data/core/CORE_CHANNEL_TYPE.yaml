id: reference_core_channel_type
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference channel type CSV data into a manual SCD2 channel type table.
control_data:
  business_key:
    fields:
      - CHANNEL_TYPE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CHANNEL_TYPE.csv
    name: reference_core_channel_type_seed
    schema: INTERMEDIATE
target:
  id: CHANNEL_TYPE
  schema: CORE
  table_name: CHANNEL_TYPE
  fields:
    - id: CHANNEL_TYPE_CODE
      source:
        pos: 0
        column: CHANNEL_TYPE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CHANNEL_TYPE_DESCRIPTION
      source:
        pos: 1
        column: CHANNEL_TYPE_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
