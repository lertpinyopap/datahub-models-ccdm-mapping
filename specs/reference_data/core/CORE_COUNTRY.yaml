id: reference_core_country
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference country CSV data into an auto SCD2 country table.
control_data:
  business_key:
    fields:
      - COUNTRY_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.COUNTRY.csv
    name: reference_core_country_seed
    schema: INTERMEDIATE
target:
  id: COUNTRY
  schema: CORE
  table_name: COUNTRY
  fields:
    - id: COUNTRY_CODE
      source:
        pos: 0
        column: COUNTRY_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
      validations:
        - type: regex
          pattern: "^([A-Z]{2}|DQ.*)$"
    - id: COUNTRY_DESCRIPTION
      source:
        pos: 1
        column: COUNTRY_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
    - id: COUNTRY_CODE_ISO_CCC
      source:
        pos: 2
        column: COUNTRY_CODE_ISO_CCC
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: COUNTRY_CODE_ISO_NNN
      source:
        pos: 3
        column: COUNTRY_CODE_ISO_NNN
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
