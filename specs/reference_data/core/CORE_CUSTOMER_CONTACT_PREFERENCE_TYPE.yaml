id: reference_core_customer_contact_preference_type
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference customer contact preference type CSV data into a manual SCD2 customer contact preference type table.
control_data:
  business_key:
    fields:
      - CUSTOMER_CONTACT_PREFERENCE_TYPE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CUSTOMER_CONTACT_PREFERENCE_TYPE.csv
    name: reference_core_customer_contact_preference_type_seed
    schema: INTERMEDIATE
target:
  id: CUSTOMER_CONTACT_PREFERENCE_TYPE
  schema: CORE
  table_name: CUSTOMER_CONTACT_PREFERENCE_TYPE
  fields:
    - id: CUSTOMER_CONTACT_PREFERENCE_TYPE_CODE
      source:
        pos: 0
        column: CUSTOMER_CONTACT_PREFERENCE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CUSTOMER_CONTACT_PREFERENCE_TYPE_DESCRIPTION
      source:
        pos: 1
        column: CUSTOMER_CONTACT_PREFERENCE_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
