id: reference_core_card_transaction_initiator
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference card transaction initiator CSV data into a manual SCD2 card transaction initiator table.
control_data:
  business_key:
    fields:
      - CARD_TRANSACTION_INITIATOR_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CARD_TRANSACTION_INITIATOR.csv
    name: reference_core_card_transaction_initiator_seed
    schema: INTERMEDIATE
target:
  id: CARD_TRANSACTION_INITIATOR
  schema: CORE
  table_name: CARD_TRANSACTION_INITIATOR
  fields:
    - id: CARD_TRANSACTION_INITIATOR_CODE
      source:
        pos: 0
        column: CARD_TRANSACTION_INITIATOR_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CARD_TRANSACTION_INITIATOR_DESCRIPTION
      source:
        pos: 1
        column: CARD_TRANSACTION_INITIATOR_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
