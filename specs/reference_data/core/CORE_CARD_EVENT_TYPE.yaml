id: reference_core_card_event_type
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference card event type CSV data into a manual SCD2 card event type table.
control_data:
  business_key:
    fields:
      - CARD_EVENT_TYPE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CARD_EVENT_TYPE.csv
    name: reference_core_card_event_type_seed
    schema: INTERMEDIATE
target:
  id: CARD_EVENT_TYPE
  schema: CORE
  table_name: CARD_EVENT_TYPE
  fields:
    - id: CARD_EVENT_TYPE_CODE
      source:
        pos: 0
        column: CARD_EVENT_TYPE_CODE
      data_type: varchar(100)
      transforms:
        - type: trim
      nullable: false
    - id: CARD_EVENT_TYPE_DESCRIPTION
      source:
        pos: 1
        column: CARD_EVENT_TYPE_DESCRIPTION
      data_type: varchar(1000)
      transforms:
        - type: trim
      nullable: false
