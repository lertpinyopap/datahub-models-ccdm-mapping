id: reference_core_card_repayment_mode
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference card repayment mode CSV data into a manual SCD2 card repayment mode table.
control_data:
  business_key:
    fields:
      - CARD_REPAYMENT_MODE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CARD_REPAYMENT_MODE.csv
    name: reference_core_card_repayment_mode_seed
    schema: INTERMEDIATE
target:
  id: CARD_REPAYMENT_MODE
  schema: CORE
  table_name: CARD_REPAYMENT_MODE
  fields:
    - id: CARD_REPAYMENT_MODE_CODE
      source:
        pos: 0
        column: CARD_REPAYMENT_MODE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CARD_REPAYMENT_MODE_DESCRIPTION
      source:
        pos: 1
        column: CARD_REPAYMENT_MODE_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
