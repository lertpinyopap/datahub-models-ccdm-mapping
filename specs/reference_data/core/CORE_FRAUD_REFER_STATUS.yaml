id: reference_core_fraud_refer_status
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference fraud refer status CSV data into a manual SCD2 fraud refer status table.
control_data:
  business_key:
    fields:
      - FRAUD_REFER_STATUS_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.FRAUD_REFER_STATUS.csv
    name: reference_core_fraud_refer_status_seed
    schema: INTERMEDIATE
target:
  id: FRAUD_REFER_STATUS
  schema: CORE
  table_name: FRAUD_REFER_STATUS
  fields:
    - id: FRAUD_REFER_STATUS_CODE
      source:
        pos: 0
        column: FRAUD_REFER_STATUS_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: FRAUD_REFER_STATUS_DESCRIPTION
      source:
        pos: 1
        column: FRAUD_REFER_STATUS_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
