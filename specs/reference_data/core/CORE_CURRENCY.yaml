id: reference_core_currency
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference currency CSV data into a manual SCD2 currency table.
control_data:
  business_key:
    fields:
      - CURRENCY_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CURRENCY.csv
    name: reference_core_currency_seed
    schema: INTERMEDIATE
target:
  id: CURRENCY
  schema: CORE
  table_name: CURRENCY
  fields:
    - id: CURRENCY_CODE
      source:
        pos: 0
        column: CURRENCY_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CURRENCY_DESCRIPTION
      source:
        pos: 1
        column: CURRENCY_DESCRIPTION
      data_type: varchar(255)
      transforms:
        - type: trim
      nullable: false
    - id: CURRENCY_CODE_ISO_NNN
      source:
        pos: 2
        column: CURRENCY_CODE_ISO_NNN
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: true
    - id: CURRENCY_ISO_MINOR_UNIT
      source:
        pos: 3
        column: CURRENCY_ISO_MINOR_UNIT
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
