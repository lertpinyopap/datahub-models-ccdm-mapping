id: reference_core_partner
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference partner CSV data into a manual SCD2 partner table.
control_data:
  business_key:
    fields:
      - PARTNER_ID
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.PARTNER.csv
    name: reference_core_partner_seed
    schema: INTERMEDIATE
target:
  id: PARTNER
  schema: CORE
  table_name: PARTNER
  fields:
    - id: PARTNER_ID
      source:
        pos: 0
        column: PARTNER_ID
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
    - id: PARTNER_NAME
      source:
        pos: 1
        column: PARTNER_NAME
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
    - id: COUNTRY_CODE
      source:
        pos: 2
        column: COUNTRY_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: DEALER_CODE
      source:
        pos: 3
        column: DEALER_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
