id: reference_core_dealer
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference dealer CSV data into a manual SCD2 dealer table.
control_data:
  business_key:
    fields:
      - DEALER_ID
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.DEALER.csv
    name: reference_core_dealer_seed
    schema: INTERMEDIATE
target:
  id: DEALER
  schema: CORE
  table_name: DEALER
  fields:
    - id: DEALER_ID
      source:
        pos: 0
        column: DEALER_ID
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
    - id: DEALER_NAME
      source:
        pos: 1
        column: DEALER_NAME
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
    - id: COUNTRY_CODE
      source:
        pos: 2
        column: COUNTRY_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
