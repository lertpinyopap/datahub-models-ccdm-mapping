id: reference_core_card_transaction_message_function
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference card transaction message function CSV data into a manual SCD2 card transaction message function table.
control_data:
  business_key:
    fields:
      - CARD_TRANSACTION_MESSAGE_FUNCTION_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CARD_TRANSACTION_MESSAGE_FUNCTION.csv
    name: reference_core_card_transaction_message_function_seed
    schema: INTERMEDIATE
target:
  id: CARD_TRANSACTION_MESSAGE_FUNCTION
  schema: CORE
  table_name: CARD_TRANSACTION_MESSAGE_FUNCTION
  fields:
    - id: CARD_TRANSACTION_MESSAGE_FUNCTION_CODE
      source:
        pos: 0
        column: CARD_TRANSACTION_MESSAGE_FUNCTION_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CARD_TRANSACTION_MESSAGE_FUNCTION_DESCRIPTION
      source:
        pos: 1
        column: CARD_TRANSACTION_MESSAGE_FUNCTION_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
