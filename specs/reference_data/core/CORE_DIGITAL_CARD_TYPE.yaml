id: reference_core_digital_card_type
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference digital card type CSV data into a manual SCD2 digital card type table.
control_data:
  business_key:
    fields:
      - DIGITAL_CARD_TYPE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.DIGITAL_CARD_TYPE.csv
    name: reference_core_digital_card_type_seed
    schema: INTERMEDIATE
target:
  id: DIGITAL_CARD_TYPE
  schema: CORE
  table_name: DIGITAL_CARD_TYPE
  fields:
    - id: DIGITAL_CARD_TYPE_CODE
      source:
        pos: 0
        column: DIGITAL_CARD_TYPE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: DIGITAL_CARD_TYPE_DESCRIPTION
      source:
        pos: 1
        column: DIGITAL_CARD_TYPE_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
