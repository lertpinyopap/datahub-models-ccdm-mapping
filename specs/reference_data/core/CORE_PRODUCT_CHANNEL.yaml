id: reference_core_product_channel
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference product channel CSV data into a manual SCD2 product channel table.
control_data:
  business_key:
    fields:
      - CHANNEL_CODE
      - PRODUCT_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.PRODUCT_CHANNEL.csv
    name: reference_core_product_channel_seed
    schema: INTERMEDIATE
target:
  id: PRODUCT_CHANNEL
  schema: CORE
  table_name: PRODUCT_CHANNEL
  fields:
    - id: CHANNEL_CODE
      source:
        pos: 0
        column: CHANNEL_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: PRODUCT_CODE
      source:
        pos: 1
        column: PRODUCT_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: PRODUCT_CHANNEL_DESCRIPTION
      source:
        pos: 2
        column: PRODUCT_CHANNEL_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
