id: reference_core_card_transaction_financial_stage
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference card transaction financial stage CSV data into a manual SCD2 card transaction financial stage table.
control_data:
  business_key:
    fields:
      - CARD_TRANSACTION_FINANCIAL_STAGE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CARD_TRANSACTION_FINANCIAL_STAGE.csv
    name: reference_core_card_transaction_financial_stage_seed
    schema: INTERMEDIATE
target:
  id: CARD_TRANSACTION_FINANCIAL_STAGE
  schema: CORE
  table_name: CARD_TRANSACTION_FINANCIAL_STAGE
  fields:
    - id: CARD_TRANSACTION_FINANCIAL_STAGE
      source:
        pos: 0
        column: CARD_TRANSACTION_FINANCIAL_STAGE
      data_type: varchar(64)
      transforms:
        - type: trim
      nullable: false
    - id: CARD_TRANSACTION_FINANCIAL_STAGE_CODE
      source:
        pos: 1
        column: CARD_TRANSACTION_FINANCIAL_STAGE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CARD_TRANSACTION_FINANCIAL_STAGE_DESCRIPTION
      source:
        pos: 2
        column: CARD_TRANSACTION_FINANCIAL_STAGE_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
