id: reference_core_channel_status
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference channel status CSV data into a manual SCD2 channel status table.
control_data:
  business_key:
    fields:
      - CHANNEL_STATUS_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CHANNEL_STATUS.csv
    name: reference_core_channel_status_seed
    schema: INTERMEDIATE
target:
  id: CHANNEL_STATUS
  schema: CORE
  table_name: CHANNEL_STATUS
  fields:
    - id: CHANNEL_STATUS_CODE
      source:
        pos: 0
        column: CHANNEL_STATUS_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CHANNEL_STATUS_DESCRIPTION
      source:
        pos: 1
        column: CHANNEL_STATUS_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
