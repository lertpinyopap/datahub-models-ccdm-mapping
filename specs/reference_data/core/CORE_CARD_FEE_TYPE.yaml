id: reference_core_card_fee_type
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference card fee type CSV data into a manual SCD2 card fee type table.
control_data:
  business_key:
    fields:
      - CARD_FEE_TYPE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CARD_FEE_TYPE.csv
    name: reference_core_card_fee_type_seed
    schema: INTERMEDIATE
target:
  id: CARD_FEE_TYPE
  schema: CORE
  table_name: CARD_FEE_TYPE
  fields:
    - id: CARD_FEE_TYPE_CODE
      source:
        pos: 0
        column: CARD_FEE_TYPE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CARD_FEE_TYPE_DESCRIPTION
      source:
        pos: 1
        column: CARD_FEE_TYPE_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
