id: reference_core_CUSTOMER_BUSINESS_STATUS_SCOPE
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference customer status CSV data into a manual SCD2 customer business status scope table.
control_data:
  business_key:
    fields:
      - CUSTOMER_BUSINESS_STATUS_SCOPE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CUSTOMER_BUSINESS_STATUS_SCOPE.csv
    name: reference_core_CUSTOMER_BUSINESS_STATUS_SCOPE_seed
    schema: INTERMEDIATE
target:
  id: CUSTOMER_BUSINESS_STATUS_SCOPE
  schema: CORE
  table_name: CUSTOMER_BUSINESS_STATUS_SCOPE
  fields:
    - id: CUSTOMER_BUSINESS_STATUS_SCOPE_CODE
      source:
        pos: 0
        column: CUSTOMER_BUSINESS_STATUS_SCOPE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CUSTOMER_BUSINESS_STATUS_SCOPE_DESCRIPTION
      source:
        pos: 1
        column: CUSTOMER_BUSINESS_STATUS_SCOPE_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
