id: reference_core_card_scheme
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference card scheme CSV data into a manual SCD2 card scheme table.
control_data:
  business_key:
    fields:
      - CARD_SCHEME_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CARD_SCHEME.csv
    name: reference_core_card_scheme_seed
    schema: INTERMEDIATE
target:
  id: CARD_SCHEME
  schema: CORE
  table_name: CARD_SCHEME
  fields:
    - id: CARD_SCHEME_CODE
      source:
        pos: 0
        column: CARD_SCHEME_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CARD_SCHEME_DESCRIPTION
      source:
        pos: 1
        column: CARD_SCHEME_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
