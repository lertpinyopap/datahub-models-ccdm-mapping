id: reference_core_block_code
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference block code CSV data into a manual SCD2 block code table.
control_data:
  business_key:
    fields:
      - BLOCK_CODE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.BLOCK_CODE.csv
    name: reference_core_block_code_seed
    schema: INTERMEDIATE
target:
  id: BLOCK_CODE
  schema: CORE
  table_name: BLOCK_CODE
  fields:
    - id: BLOCK_CODE_CODE
      source:
        pos: 0
        column: BLOCK_CODE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: BLOCK_CODE_DESCRIPTION
      source:
        pos: 1
        column: BLOCK_CODE_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
