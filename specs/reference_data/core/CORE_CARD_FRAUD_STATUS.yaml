id: reference_core_card_fraud_status
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference card fraud status CSV data into a manual SCD2 card fraud status table.
control_data:
  business_key:
    fields:
      - CARD_FRAUD_STATUS_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.CARD_FRAUD_STATUS.csv
    name: reference_core_card_fraud_status_seed
    schema: INTERMEDIATE
target:
  id: CARD_FRAUD_STATUS
  schema: CORE
  table_name: CARD_FRAUD_STATUS
  fields:
    - id: CARD_FRAUD_STATUS_CODE
      source:
        pos: 0
        column: CARD_FRAUD_STATUS_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: CARD_FRAUD_STATUS_DESCRIPTION
      source:
        pos: 1
        column: CARD_FRAUD_STATUS_DESCRIPTION
      data_type: varchar(16777216)
      transforms:
        - type: trim
      nullable: false
