id: reference_core_email_type
extends: REFERENCE_CORE_SCD2_MANUAL
description: Maps reference email type CSV data into a manual SCD2 email type table.
control_data:
  business_key:
    fields:
      - EMAIL_TYPE_CODE
source:
  seed:
    file: data/reference_data/core/REFERENCE.CORE.EMAIL_TYPE.csv
    name: reference_core_email_type_seed
    schema: INTERMEDIATE
target:
  id: EMAIL_TYPE
  schema: CORE
  table_name: EMAIL_TYPE
  fields:
    - id: EMAIL_TYPE_CODE
      source:
        pos: 0
        column: EMAIL_TYPE_CODE
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
    - id: EMAIL_TYPE_DESCRIPTION
      source:
        pos: 1
        column: EMAIL_TYPE_DESCRIPTION
      data_type: varchar(255)
      transforms:
        - type: trim
      nullable: false
