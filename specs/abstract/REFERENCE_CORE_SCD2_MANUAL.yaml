id: reference_core_scd2_manual
description: Shared manual SCD2 pattern for CORE reference datasets where the source CSV already provides history columns.
control_data:
  materialisation_type: table
  change_type: scd2_manual
  validation_enabled: true
  scd:
    update_mode: upsert
    update_key:
      fields:
        - VALID_FROM_DATE
    validity:
      data_type: date
      valid_from:
        column: VALID_FROM_DATE
        source:
          column: VALID_FROM_DATETIME
        transforms:
          - type: parse_date
            format: "%Y-%m-%d"
      valid_to:
        column: VALID_TO_DATE
        source:
          column: VALID_TO_DATETIME
        transforms:
          - type: parse_date
            format: "%Y-%m-%d"
  failure_mode: fail_load
source:
  format: csv
  header: true
  load_method: dbt_seed
  delimiter: ","
  quotechar: '"'
  lineterminator: "\r\n"
  quoting: minimal
target:
  id: reference_core_manual_scd2
  schema: CORE
  fields:
    - id: IS_CURRENT_FLAG
      source:
        column: IS_CURRENT_FLAG
      data_type: varchar(1)
      transforms:
        - type: trim
      nullable: false
      validations:
        - type: allowed_values
          values:
            - "Y"
            - "N"
    - id: IS_DELETED_FLAG
      source:
        column: IS_DELETED_FLAG
      data_type: varchar(1)
      transforms:
        - type: trim
      nullable: false
      validations:
        - type: allowed_values
          values:
            - "Y"
            - "N"
    - id: AUDIT_CREATED_SOURCE
      source:
        fixed_value: DBT
      data_type: varchar(16777216)
      nullable: false
    - id: AUDIT_LAST_CHANGED_SOURCE
      source:
        fixed_value: DBT
      data_type: varchar(16777216)
      nullable: false
