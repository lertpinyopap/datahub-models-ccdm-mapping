id: reference_mapping_scd2_auto
description: Shared SCD2 auto pattern for mapping reference datasets loaded from CSV seed files.
control_data:
  materialisation_type: table
  failure_mode: fail_load
  change_type: scd2_auto
  validation_enabled: true
  staging_schema: INTERMEDIATE
  business_key:
    fields:
      - SOURCE_SYSTEM
      - SOURCE_CODE
  scd:
    insert_time: '{{ var("insert_time") }}'
    validity:
      data_type: date
      valid_from:
        column: VALID_FROM_DATE
      valid_to:
        column: VALID_TO_DATE
    scd2_auto_from_sot: true
    scd2_validation_enabled: true
    scd2_validation: continuous
source:
  format: csv
  header: true
  load_method: dbt_seed
  delimiter: ","
  quotechar: '"'
  lineterminator: "\r\n"
  quoting: minimal
target:
  id: reference_mapping_scd2
  schema: MAPPING
  fields:
    - id: SOURCE_SYSTEM
      source:
        pos: 1
        column: SOURCE_SYSTEM
      data_type: varchar(50)
    - id: SOURCE_CODE
      source:
        pos: 2
        column: SOURCE_CODE
      data_type: varchar(50)
    - id: SOURCE_DESCRIPTION
      source:
        pos: 3
        column: SOURCE_DESCRIPTION
      data_type: varchar(255)
      nullable: true
    - id: TARGET_SYSTEM
      source:
        pos: 4
        column: TARGET_SYSTEM
      data_type: varchar(255)
      transforms:
        - type: custom
          macro: reference_lookup_mapping_macros.prefix_target_system
    - id: TARGET_CODE
      source:
        pos: 5
        column: TARGET_CODE
      data_type: varchar(50)
    - id: TARGET_DESCRIPTION
      source:
        pos: 6
        column: TARGET_DESCRIPTION
      data_type: varchar(255)
      nullable: true
    - id: AUDIT_CREATED_SOURCE
      source:
        fixed_value: DBT
      data_type: varchar(16777216)
      nullable: false
    - id: AUDIT_LAST_CHANGED_SOURCE
      source:
        fixed_value: DBT
      data_type: varchar(16777216)
      nullable: false
