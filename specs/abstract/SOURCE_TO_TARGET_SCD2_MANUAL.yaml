id: source_to_target_scd2_manual
description: Shared manual SCD2 pattern for source-to-target table mappings where the source query provides SCD2 control columns.
control_data:
  materialisation_type: table
  change_type: scd2_manual
  failure_mode: fail_load
  staging_schema: INTERMEDIATE
  scd:
    update_mode: upsert
    update_key:
      fields:
        - VALID_FROM_DATETIME
source:
  format: table
target:
  schema: CORE
  fields:
    - id: IS_CURRENT_FLAG
      source:
        column: IS_CURRENT_FLAG
      data_type: varchar(1)
      transforms:
        - type: trim
      nullable: false
      validations:
        - type: allowed_values
          values:
            - "Y"
            - "N"

    - id: IS_DELETED_FLAG
      source:
        column: IS_DELETED_FLAG
      data_type: varchar(1)
      transforms:
        - type: trim
      nullable: false
      validations:
        - type: allowed_values
          values:
            - "Y"
            - "N"

    - id: VALID_FROM_DATETIME
      source:
        column: VALID_FROM_DATETIME
      data_type: timestamp_tz
      nullable: false

    - id: VALID_TO_DATETIME
      source:
        column: VALID_TO_DATETIME
      data_type: timestamp_tz
      nullable: false
