id: card_customer_phone
extends: SOURCE_TO_TARGET_SCD2_DERIVED
description: Maps V10 customer phone numbers into CORE.CARD_CUSTOMER_PHONE.
control_data:
  business_key:
    fields:
      - CARD_CUSTOMER_BUSINESS_KEY
      - PHONE_NUMBER_TYPE_KEY
      - PHONE_NUMBER
  business_data_hash:
    business_data_hash_mode: include
    fields:
      - PHONE_CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      - SMS_CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      - EXTENSION
  scd:
    derivation_scope: affected_keys
    validation_scope: affected_window
    window_strategy: previous_and_next
    current_flag:
      mode: latest_per_business_key
    deleted_flag:
      mode: fixed
      value: N
source:
  format: table
  query: |
    with phone_rows as (
      select AMNA_ACCT as CUSTOMER_ID, 'PHON' as PHONE_TYPE_CODE, AMNA_HOME_PHONE_FLAG_01 as PHONE_FLAG, null as SMS_FLAG, trim(AMNA_HOME_PHONE_01) as PHONE_NUMBER, cast(null as varchar) as EXTENSION, cast(AMNA_DATE_LAST_MAINT as timestamp_ltz) as SOURCE_EFFECTIVE_FROM_DATETIME from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER
      union all select AMNA_ACCT, 'MOBL', AMNA_MOBILE_PHONE_FLAG_01, AMNA_SMS_FLAG_01, trim(AMNA_MOBILE_PHONE_01), cast(null as varchar), cast(AMNA_DATE_LAST_MAINT as timestamp_ltz) from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER
      union all select AMNA_ACCT, 'WORK', AMNA_PHONE_FLAG_01, null, trim(AMNA_EMP_PHONE_01), trim(AMNA_EMP_PHONE_EXTN_01), cast(AMNA_DATE_LAST_MAINT as timestamp_ltz) from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER
      union all select AMNA_ACCT, 'FAX', null, null, trim(AMNA_FAX_PHONE_01), cast(null as varchar), cast(AMNA_DATE_LAST_MAINT as timestamp_ltz) from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER
      union all select AMNA_ACCT, 'PHON', AMNA_HOME_PHONE_FLAG_02, null, trim(AMNA_HOME_PHONE_02), cast(null as varchar), cast(AMNA_DATE_LAST_MAINT as timestamp_ltz) from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER
      union all select AMNA_ACCT, 'MOBL', AMNA_MOBILE_PHONE_FLAG_02, AMNA_SMS_FLAG_02, trim(AMNA_MOBILE_PHONE_02), cast(null as varchar), cast(AMNA_DATE_LAST_MAINT as timestamp_ltz) from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER
      union all select AMNA_ACCT, 'WORK', AMNA_PHONE_FLAG_02, null, trim(AMNA_EMP_PHONE_02), trim(AMNA_EMP_PHONE_EXTN_02), cast(AMNA_DATE_LAST_MAINT as timestamp_ltz) from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER
      union all select AMNA_ACCT, 'FAX', null, null, trim(AMNA_FAX_PHONE_02), cast(null as varchar), cast(AMNA_DATE_LAST_MAINT as timestamp_ltz) from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER
    ), card_customer as (
      select CUSTOMER_ID, CARD_CUSTOMER_KEY, CARD_CUSTOMER_BUSINESS_KEY from {{ var("database") }}.CORE.CARD_CUSTOMER where IS_CURRENT_FLAG = 'Y'
      qualify row_number() over (partition by CUSTOMER_ID order by AUDIT_LAST_CHANGED_DATETIME desc nulls last) = 1
    )
    select C.CARD_CUSTOMER_KEY, C.CARD_CUSTOMER_BUSINESS_KEY, P.* from phone_rows P join card_customer C on C.CUSTOMER_ID = P.CUSTOMER_ID where nullif(trim(P.PHONE_NUMBER), '') is not null
target:
  id: CARD_CUSTOMER_PHONE
  schema: CORE
  fields:
    - id: CARD_CUSTOMER_KEY
      source:
        column: CARD_CUSTOMER_KEY
      data_type: varchar(64)
      nullable: false
    - id: CARD_CUSTOMER_BUSINESS_KEY
      source:
        column: CARD_CUSTOMER_BUSINESS_KEY
      data_type: varchar(64)
      nullable: false
    - id: PHONE_NUMBER_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: PHONE_NUMBER_TYPE
          source_system: V10
          source_code_column: PHONE_TYPE_CODE
          required: true
      data_type: varchar(64)
      nullable: false
    - id: PHONE_CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: CUSTOMER_CONTACT_PREFERENCE_TYPE
          source_system: V10
          source_code_expression: case when source_query.PHONE_FLAG = 2 then 'PREFERRED' when source_query.PHONE_FLAG = 1
            then 'UNDEC' else 'NOCTCT' end
          required: true
      data_type: varchar(64)
      nullable: false
    - id: SMS_CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: CUSTOMER_CONTACT_PREFERENCE_TYPE
          source_system: V10
          source_code_expression: case when source_query.SMS_FLAG = 2 then 'PREFERRED' when source_query.SMS_FLAG = 1 then
            'UNDEC' when source_query.SMS_FLAG = 0 then 'NOCTCT' else 'DQNotApplicable' end
          required: true
      data_type: varchar(64)
      nullable: false
    - id: PHONE_NUMBER
      source:
        column: PHONE_NUMBER
      data_type: varchar(40)
      nullable: false
    - id: EXTENSION
      source:
        column: EXTENSION
      data_type: varchar(40)
      nullable: true
    - id: VALID_FROM_DATETIME
      source:
        column: SOURCE_EFFECTIVE_FROM_DATETIME
      data_type: timestamp_ltz
      nullable: false
