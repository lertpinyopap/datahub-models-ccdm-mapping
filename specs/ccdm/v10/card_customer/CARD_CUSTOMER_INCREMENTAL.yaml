id: card_customer_historical_incremental
extends: card_customer_historical_initial_load
description: >
  Incremental CARD_CUSTOMER SCD2 load that retains every distinct
  effective-dated source state, including multiple changes for the same
  customer in one source delivery.
source:
  format: table
  query: |
    with latest_customer_rows as (
        select
            C.AMNA_ADD_STATUS,
            C.AMNA_STATUS,
            C.AMNA_ACCT as CUSTOMER_ID,
            C.AMNA_TITLE_01 as TITLE,
            C.AMNA_FIRST_NAME_01 as FIRST_NAME,
            C.AMNA_MIDDLE_NAME_01 as MIDDLE_NAME,
            C.AMNA_LAST_NAME_01 as SURNAME,
            C.AMNA_DOB_01 as DATE_OF_BIRTH,
            C.AMNA_DATE_LAST_MAINT as UPDATED_DATETIME
        from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER as C
        where C.AMNA_EMAIL_01 not like '%TEST%'
          and {{
              tms_incremental_bookmark_predicate(
                  'C.AIRFLOW_DAG_TIME',
                  "AMNA_EMAIL_01 NOT LIKE '%TEST%'"
              )
          }}
    ),
    incoming_customer_ids as (
        select distinct CUSTOMER_ID
        from latest_customer_rows
    ),
    ambs_acct as (
        select
            A.AMBS_CUST_NBR,
            min(A.AMBS_DATE_OPENED) as AMBS_DATE_OPENED
        from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.ACCOUNT_BASE_SEGMENT as A
        inner join incoming_customer_ids as I
            on A.AMBS_CUST_NBR = I.CUSTOMER_ID
        group by A.AMBS_CUST_NBR
    ),
    current_card_customer as (
        select
            T.CUSTOMER_ID,
            T.CREATED_DATETIME
        from {{ var("database") }}.CORE.{{ var("card_customer_table", "CARD_CUSTOMER") }} as T
        inner join incoming_customer_ids as I
            on T.CUSTOMER_ID = I.CUSTOMER_ID
        where T.IS_CURRENT_FLAG = 'Y'
          and coalesce(T.IS_DELETED_FLAG, 'N') <> 'Y'
        qualify row_number() over (
            partition by T.CUSTOMER_ID
            order by T.VALID_FROM_DATETIME desc, T.AUDIT_LAST_CHANGED_DATETIME desc
        ) = 1
    )
    select distinct
        C.AMNA_ADD_STATUS,
        C.AMNA_STATUS,
        case
            when C.AMNA_ADD_STATUS = 99
             and C.AMNA_STATUS = 0 then 'Y'
            else 'N'
        end as IS_ACTIVE_IN_SOURCE_FLAG,
        C.CUSTOMER_ID,
        C.TITLE,
        C.FIRST_NAME,
        C.MIDDLE_NAME,
        C.SURNAME,
        C.DATE_OF_BIRTH,
        C.UPDATED_DATETIME,
        coalesce(current_card_customer.CREATED_DATETIME, A.AMBS_DATE_OPENED)
            as CREATED_DATETIME,
        case
            when C.UPDATED_DATETIME is null
              or C.UPDATED_DATETIME
                    < coalesce(current_card_customer.CREATED_DATETIME, A.AMBS_DATE_OPENED)
                then coalesce(current_card_customer.CREATED_DATETIME, A.AMBS_DATE_OPENED)
            else C.UPDATED_DATETIME
        end as SOURCE_EFFECTIVE_FROM_DATETIME
    from latest_customer_rows as C
    inner join ambs_acct as A
        on C.CUSTOMER_ID = A.AMBS_CUST_NBR
    left join current_card_customer
        on C.CUSTOMER_ID = current_card_customer.CUSTOMER_ID
