id: card_customer_event
extends: SOURCE_TO_TARGET_SCD2_DERIVED
description: Maps V10 non-monetary customer events into CORE.CARD_CUSTOMER_EVENT.
control_data:
  business_key:
    fields:
      - CARD_CUSTOMER_BUSINESS_KEY
      - EVENT_ID
  business_data_hash:
    business_data_hash_mode: include
    fields:
      - CARD_CUSTOMER_EVENT_TYPE_KEY
      - EVENT_DESCRIPTION
      - EVENT_CREATION_DATETIME
  scd:
    derivation_scope: affected_keys
    validation_scope: affected_window
    window_strategy: previous_and_next
    current_flag:
      mode: latest_per_business_key
    deleted_flag:
      mode: fixed
      value: N
source:
  format: table
  query: |
    with events as (
      select C.AMNA_ACCT as CUSTOMER_ID,
        sha2(concat_ws('|', H.AMHS_ND_ACCOUNT, H.AMHS_ND_ACTION_CODE, H.AMHS_ND_ACTION_DESC, H.AMHS_ND_HIST_DATE, H.AMHS_ND_HIST_TIME), 256) as EVENT_ID,
        H.AMHS_ND_ACTION_CODE as EVENT_TYPE_CODE, H.AMHS_ND_ACTION_DESC as EVENT_DESCRIPTION,
        try_to_timestamp_ltz(H.AMHS_ND_HIST_DATE::varchar || ' ' || lpad(H.AMHS_ND_HIST_TIME::varchar, 6, '0'), 'YYYY-MM-DD HH24MISS') as EVENT_CREATION_DATETIME,
        try_to_timestamp_ltz(H.AMHS_ND_HIST_DATE::varchar || ' ' || lpad(H.AMHS_ND_HIST_TIME::varchar, 6, '0'), 'YYYY-MM-DD HH24MISS') as SOURCE_EFFECTIVE_FROM_DATETIME
      from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.ASM_MEMO_NONMONETARY H
      join DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.ACCOUNT_BASE_SEGMENT A on A.AMBS_ACCT = H.AMHS_ND_ACCOUNT
      join DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER C on C.AMNA_ACCT = A.AMBS_CUST_NBR
      where H.AMHS_ND_ACTION_CODE in ('ADDR', 'CONT', 'LETR', 'B2FM', 'NADD', 'ANEX')
    ), card_customer as (
      select CUSTOMER_ID, CARD_CUSTOMER_KEY, CARD_CUSTOMER_BUSINESS_KEY from {{ var("database") }}.CORE.CARD_CUSTOMER where IS_CURRENT_FLAG = 'Y'
      qualify row_number() over (partition by CUSTOMER_ID order by AUDIT_LAST_CHANGED_DATETIME desc nulls last) = 1
    )
    select C.CARD_CUSTOMER_KEY, C.CARD_CUSTOMER_BUSINESS_KEY, E.* from events E join card_customer C on C.CUSTOMER_ID = E.CUSTOMER_ID
target:
  id: CARD_CUSTOMER_EVENT
  schema: CORE
  fields:
    - id: CARD_CUSTOMER_KEY
      source:
        column: CARD_CUSTOMER_KEY
      data_type: varchar(64)
      nullable: false
    - id: CARD_CUSTOMER_BUSINESS_KEY
      source:
        column: CARD_CUSTOMER_BUSINESS_KEY
      data_type: varchar(64)
      nullable: false
    - id: CARD_CUSTOMER_EVENT_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: CARD_CUSTOMER_EVENT_TYPE
          source_system: V10
          source_code_column: EVENT_TYPE_CODE
          required: true
      data_type: varchar(64)
      nullable: false
    - id: EVENT_ID
      source:
        column: EVENT_ID
      data_type: varchar(16777216)
      nullable: false
    - id: EVENT_DESCRIPTION
      source:
        column: EVENT_DESCRIPTION
      data_type: varchar(16777216)
      nullable: true
    - id: EVENT_CREATION_DATETIME
      source:
        column: EVENT_CREATION_DATETIME
      data_type: timestamp_ltz
      nullable: false
    - id: VALID_FROM_DATETIME
      source:
        column: SOURCE_EFFECTIVE_FROM_DATETIME
      data_type: timestamp_ltz
      nullable: false
