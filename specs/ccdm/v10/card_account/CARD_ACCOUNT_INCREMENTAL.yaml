id: card_account_incremental
extends: card_account_historical_initial_load
description: >
  Incremental CARD_ACCOUNT SCD2 load. It processes only V10 account rows
  delivered after the CARD_ACCOUNT_INCREMENTAL bookmark and derives each
  incoming version from the source last-maintenance date.
source:
  format: table
  query: |
    -- Read only account snapshots delivered after the TMS bookmark.
    with latest_account_rows as (
        select
            A.AMBS_CUST_NBR as CUSTOMER_ID,
            A.AMBS_ACCT as AGREEMENT_ID,
            A.AMBS_ORG as PRODUCT_ORG,
            A.AMBS_LOGO as PRODUCT_LOGO,
            A.AMBS_LFS_SOL_CODE,
            A.AMBS_BILLING_CYCLE as BILLING_CYCLE_DATE,
            A.AMBS_CRLIM as CREDIT_LIMIT_AMOUNT,
            A.AMBS_CURR_CODE as CURRENCY_SOURCE_CODE,
            A.AMBS_CASH_CRLIM as CASH_LIMIT_AMOUNT,
            case
                when A.AMBS_DATE_CLOSED is not null
                 and cast(A.AMBS_DATE_CLOSED as varchar) not like '%1901%'
                    then cast(A.AMBS_DATE_CLOSED as date)
                else null
            end as CLOSURE_REQUEST_DATE,
            case
                when A.AMBS_DATE_CLOSED is not null
                 and cast(A.AMBS_DATE_CLOSED as varchar) not like '%1901%'
                    then cast(A.AMBS_DATE_CLOSED as timestamp_ntz)
                else null
            end as CLOSING_DATETIME,
            case
                when A.AMBS_DATE_CLOSED is null
                  or cast(A.AMBS_DATE_CLOSED as varchar) like '%1901%'
                    then 'Y'
                else 'N'
            end as IS_ACTIVE_IN_SOURCE_FLAG,
            coalesce(
                cast(nullif(A.AMBS_DATE_LAST_MAINT, to_date('1901-01-01')) as timestamp_ntz),
                cast(nullif(A.AMBS_DATE_OPENED, to_date('1901-01-01')) as timestamp_ntz),
                cast('1901-01-01' as timestamp_ntz)
            ) as SOURCE_EFFECTIVE_FROM_DATETIME
        from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.ACCOUNT_BASE_SEGMENT as A
        where (A.AMBS_CURR_CODE is null
            or lpad(cast(A.AMBS_CURR_CODE as varchar), 3, '0') <> '000')
          and {{ tms_incremental_bookmark_predicate('A.AIRFLOW_DAG_TIME') }}
    ),
    -- Select one current customer key pair to avoid multiplying account rows.
    card_customer_lookup as (
        select CUSTOMER_ID, CARD_CUSTOMER_KEY, CARD_CUSTOMER_BUSINESS_KEY
        from {{ var("database") }}.CORE.{{ var("card_customer_table", "CARD_CUSTOMER") }}
        qualify row_number() over (
            partition by CUSTOMER_ID
            order by AUDIT_LAST_CHANGED_DATETIME desc nulls last, AUDIT_CREATED_DATETIME desc nulls last
        ) = 1
    )
    select
        C.CARD_CUSTOMER_KEY,
        C.CARD_CUSTOMER_BUSINESS_KEY,
        A.AGREEMENT_ID,
        A.PRODUCT_ORG,
        A.PRODUCT_LOGO,
        A.AMBS_LFS_SOL_CODE,
        A.BILLING_CYCLE_DATE,
        A.CREDIT_LIMIT_AMOUNT,
        A.CURRENCY_SOURCE_CODE,
        A.CASH_LIMIT_AMOUNT,
        A.CLOSURE_REQUEST_DATE,
        A.CLOSING_DATETIME,
        A.IS_ACTIVE_IN_SOURCE_FLAG,
        A.SOURCE_EFFECTIVE_FROM_DATETIME
    from latest_account_rows as A
    inner join card_customer_lookup as C
        on C.CUSTOMER_ID = A.CUSTOMER_ID
