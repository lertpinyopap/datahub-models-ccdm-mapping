id: card_customer_email_address
extends: SOURCE_TO_TARGET_SCD2_DERIVED
description: Maps V10 customer email addresses into CORE.CARD_CUSTOMER_EMAIL_ADDRESS.
control_data:
  business_key:
    fields:
      - CARD_CUSTOMER_BUSINESS_KEY
      - EMAIL_ADDRESS_TYPE_KEY
      - EMAIL_ADDRESS
  business_data_hash:
    business_data_hash_mode: include
    fields:
      - CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      - EMAIL_ADDRESS_LOCAL_PART
      - EMAIL_ADDRESS_SUBADDRESS_TAG
      - EMAIL_ADDRESS_DOMAIN
  scd:
    derivation_scope: affected_keys
    validation_scope: affected_window
    window_strategy: previous_and_next
    current_flag:
      mode: latest_per_business_key
    deleted_flag:
      mode: fixed
      value: N
source:
  format: table
  query: |
    with email_rows as (
      select AMNA_ACCT as CUSTOMER_ID, 'PERS' as EMAIL_TYPE_CODE, AMNA_EMAIL_FLAG_01 as PREFERENCE_FLAG,
        lower(trim(AMNA_EMAIL_01)) as EMAIL_ADDRESS, cast(AMNA_DATE_LAST_MAINT as timestamp_ltz) as SOURCE_EFFECTIVE_FROM_DATETIME
      from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER
      where nullif(trim(AMNA_EMAIL_01), '') is not null
      union all
      select AMNA_ACCT, 'PERS', AMNA_EMAIL_FLAG_02, lower(trim(AMNA_EMAIL_02)), cast(AMNA_DATE_LAST_MAINT as timestamp_ltz)
      from DATAOPS_HUB_SHARE_VISION{{ var("DATAOPS_ENV_SUFFIX", "_NONPROD") }}.RAW.CUSTOMER
      where nullif(trim(AMNA_EMAIL_02), '') is not null
    ), deduplicated_email_rows as (
      select * from email_rows qualify row_number() over (partition by CUSTOMER_ID, EMAIL_TYPE_CODE, EMAIL_ADDRESS order by SOURCE_EFFECTIVE_FROM_DATETIME desc) = 1
    ), card_customer as (
      select CUSTOMER_ID, CARD_CUSTOMER_KEY, CARD_CUSTOMER_BUSINESS_KEY from {{ var("database") }}.CORE.CARD_CUSTOMER where IS_CURRENT_FLAG = 'Y'
      qualify row_number() over (partition by CUSTOMER_ID order by AUDIT_LAST_CHANGED_DATETIME desc nulls last) = 1
    )
    select C.CARD_CUSTOMER_KEY, C.CARD_CUSTOMER_BUSINESS_KEY, E.*, split_part(E.EMAIL_ADDRESS, '@', 1) as EMAIL_ADDRESS_LOCAL_PART,
      nullif(split_part(split_part(E.EMAIL_ADDRESS, '@', 1), '+', 2), '') as EMAIL_ADDRESS_SUBADDRESS_TAG,
      split_part(E.EMAIL_ADDRESS, '@', 2) as EMAIL_ADDRESS_DOMAIN
    from deduplicated_email_rows E join card_customer C on C.CUSTOMER_ID = E.CUSTOMER_ID
target:
  id: CARD_CUSTOMER_EMAIL_ADDRESS
  schema: CORE
  fields:
    - id: CARD_CUSTOMER_KEY
      source:
        column: CARD_CUSTOMER_KEY
      data_type: varchar(64)
      nullable: false
    - id: CARD_CUSTOMER_BUSINESS_KEY
      source:
        column: CARD_CUSTOMER_BUSINESS_KEY
      data_type: varchar(64)
      nullable: false
    - id: EMAIL_ADDRESS_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: EMAIL_ADDRESS_TYPE
          source_system: V10
          source_code_column: EMAIL_TYPE_CODE
          required: true
      data_type: varchar(64)
      nullable: false
    - id: CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: CUSTOMER_CONTACT_PREFERENCE_TYPE
          source_system: V10
          source_code_expression: case when source_query.PREFERENCE_FLAG is null then 'DQMissing' when source_query.PREFERENCE_FLAG
            = 2 then 'PREFERRED' when source_query.PREFERENCE_FLAG = 1 then 'UNDEC' when source_query.PREFERENCE_FLAG = 0
            then 'NOCTCT' else 'DQMapping' end
          required: true
      data_type: varchar(64)
      nullable: false
    - id: EMAIL_ADDRESS
      source:
        column: EMAIL_ADDRESS
      data_type: varchar(1024)
      nullable: false
    - id: EMAIL_ADDRESS_LOCAL_PART
      source:
        column: EMAIL_ADDRESS_LOCAL_PART
      data_type: varchar(1024)
      nullable: false
    - id: EMAIL_ADDRESS_SUBADDRESS_TAG
      source:
        column: EMAIL_ADDRESS_SUBADDRESS_TAG
      data_type: varchar(1024)
      nullable: true
    - id: EMAIL_ADDRESS_DOMAIN
      source:
        column: EMAIL_ADDRESS_DOMAIN
      data_type: varchar(1024)
      nullable: false
    - id: VALID_FROM_DATETIME
      source:
        column: SOURCE_EFFECTIVE_FROM_DATETIME
      data_type: timestamp_ltz
      nullable: false
