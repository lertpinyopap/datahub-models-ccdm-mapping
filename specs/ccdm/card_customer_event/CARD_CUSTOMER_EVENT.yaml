id: card_customer_event
extends: SOURCE_TO_TARGET_SCD2_DERIVED
description: Maps V10 non-monetary customer events into PAY.CORE.CARD_CUSTOMER_EVENT.
control_data:
  business_key:
    fields:
      - CARD_CUSTOMER_KEY
      - CARD_CUSTOMER_BUSINESS_KEY
      - EVENT_ID
  business_data_hash:
    business_data_hash_mode: include
    fields:
      - CARD_CUSTOMER_EVENT_TYPE_KEY
      - EVENT_ID
      - EVENT_DESCRIPTION
      - EVENT_CREATION_DATETIME
  scd:
    derivation_scope: affected_keys
    validation_scope: affected_window
    window_strategy: previous_and_next
    valid_from_datetime:
      expression: EVENT_CREATION_DATETIME
    valid_to_datetime:
      mode: next_valid_from
      offset:
        unit: nanosecond
        value: -1
      end_of_time: "9999-12-31 23:59:59 +00:00"
    current_flag:
      mode: latest_per_business_key
    deleted_flag:
      mode: fixed
      value: "N"
source:
  format: table
  query: |
    with event_rows as (
        select
            c.AMNA_ACCT as CUSTOMER_ID,
            sha2(
                concat_ws(
                    '|',
                    coalesce(cast(h.AMHS_ND_ACCOUNT as varchar), ''),
                    coalesce(cast(h.AMHS_ND_ACTION_CODE as varchar), ''),
                    coalesce(cast(h.AMHS_ND_ACTION_DESC as varchar), ''),
                    coalesce(cast(h.AMHS_ND_HIST_DATE as varchar), ''),
                    coalesce(cast(h.AMHS_ND_HIST_TIME as varchar), '')
                ),
                256
            ) as EVENT_ID,
            h.AMHS_ND_ACTION_CODE as EVENT_TYPE_CODE,
            h.AMHS_ND_ACTION_DESC as EVENT_DESCRIPTION,
            try_to_timestamp_ntz(
                h.AMHS_ND_HIST_DATE::varchar || ' ' ||
                left(lpad(trim(h.AMHS_ND_HIST_TIME::varchar), 6, '0'), 4) || '00',
                'YYYY-MM-DD HH24MISS'
            ) as EVENT_CREATION_DATETIME
        from DATAOPS_HUB_SHARE_VISION_NONPROD.ODS.ASM_MEMO_NONMONETARY as h
        join DATAOPS_HUB_SHARE_VISION_NONPROD.ODS.ACCOUNT_BASE_SEGMENT as a
            on h.AMHS_ND_ACCOUNT = a.AMBS_ACCT
        join DATAOPS_HUB_SHARE_VISION_NONPROD.ODS.CUSTOMER as c
            on a.AMBS_CUST_NBR = c.AMNA_ACCT
        where h.AMHS_ND_ACTION_CODE in ('ADDR', 'CONT', 'LETR', 'B2FM', 'NADD', 'ANEX')
    ),
    card_customer_lookup as (
        select
            CUSTOMER_ID,
            CARD_CUSTOMER_KEY,
            CARD_CUSTOMER_BUSINESS_KEY
        from SAS_MIGRATION_WORKSPACE.CORE.CARD_CUSTOMER
        where IS_CURRENT_FLAG = 'Y'
        qualify row_number() over (
            partition by CUSTOMER_ID
            order by
                AUDIT_LAST_CHANGED_DATETIME desc nulls last,
                AUDIT_CREATED_DATETIME desc nulls last
        ) = 1
    )
    select
        card_customer_lookup.CARD_CUSTOMER_KEY,
        card_customer_lookup.CARD_CUSTOMER_BUSINESS_KEY,
        event_rows.EVENT_ID,
        event_rows.EVENT_TYPE_CODE,
        event_rows.EVENT_DESCRIPTION,
        event_rows.EVENT_CREATION_DATETIME
    from event_rows
    -- left join card_customer_lookup
    inner join card_customer_lookup
        on card_customer_lookup.CUSTOMER_ID = event_rows.CUSTOMER_ID
target:
  id: CARD_CUSTOMER_EVENT
  schema: CORE
  fields:
    - id: CARD_CUSTOMER_KEY
      source:
        column: CARD_CUSTOMER_KEY
      data_type: varchar(64)
      nullable: false

    - id: CARD_CUSTOMER_BUSINESS_KEY
      source:
        column: CARD_CUSTOMER_BUSINESS_KEY
      data_type: varchar(64)
      nullable: false

    - id: CARD_CUSTOMER_EVENT_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: CARD_CUSTOMER_EVENT_TYPE
          source_system: V10
          source_code_column: EVENT_TYPE_CODE
          required: true
      data_type: varchar(64)
      nullable: false

    - id: EVENT_ID
      source:
        column: EVENT_ID
      data_type: varchar(16777216)
      nullable: false

    - id: EVENT_DESCRIPTION
      source:
        column: EVENT_DESCRIPTION
      data_type: varchar(16777216)
      nullable: true

    - id: EVENT_CREATION_DATETIME
      source:
        column: EVENT_CREATION_DATETIME
      data_type: timestamp_tz
      nullable: false
