id: card_customer_address
extends: SOURCE_TO_TARGET_SCD2_DERIVED
description: Maps V10 customer addresses into PAY.CORE.CARD_CUSTOMER_ADDRESS.
control_data:
  business_key:
    fields:
      - CARD_CUSTOMER_KEY
      - CARD_CUSTOMER_BUSINESS_KEY
      - ADDRESS_TYPE_KEY
      - CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      - ADDRESS_COUNTRY_KEY
      - BUILDING_NUMBER
      - BUILDING_NAME
      - ADDRESS_LINE1
      - ADDRESS_LINE2
      - ADDRESS_LINE3
      - ADDRESS_LINE4
      - TOWN_NAME
      - REGION
      - POSTAL_CODE
  business_data_hash:
    business_data_hash_mode: include
    fields:
      - CARD_CUSTOMER_KEY
      - CARD_CUSTOMER_BUSINESS_KEY
      - ADDRESS_TYPE_KEY
      - ADDRESS_COUNTRY_KEY
      - CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      - BUILDING_NUMBER
      - BUILDING_NAME
      - STREET_NAME
      - ADDRESS_LINE1
      - ADDRESS_LINE2
      - ADDRESS_LINE3
      - ADDRESS_LINE4
      - TOWN_NAME
      - REGION
      - POSTAL_CODE
  scd:
    derivation_scope: affected_keys
    validation_scope: affected_window
    window_strategy: previous_and_next
    valid_from_datetime:
      expression: SOURCE_EFFECTIVE_FROM_DATETIME
    valid_to_datetime:
      mode: next_valid_from
      offset:
        unit: nanosecond
        value: -1
      end_of_time: "9999-12-31 23:59:59 +00:00"
    current_flag:
      mode: latest_per_business_key
    deleted_flag:
      mode: fixed
      value: "N"
    deduplicate:
      partition_by:
        - CARD_CUSTOMER_KEY
        - CARD_CUSTOMER_BUSINESS_KEY
        - ADDRESS_TYPE_KEY
        - ADDRESS_COUNTRY_KEY
        - ADDRESS_LINE1
        - VALID_FROM_DATETIME
      order_by:
        - column: SOURCE_EFFECTIVE_FROM_DATETIME
          direction: desc
          nulls: last
source:
  format: table
  query: |
    with address_rows as (
        select
            C.AMNA_ACCT as CUSTOMER_ID,
            'HOME' as ADDRESS_TYPE_CODE,
            C.AMNA_CNTRY_CD_01 as ADDRESS_COUNTRY_SOURCE_CODE,
            'PREFERRED' as CUSTOMER_CONTACT_PREFERENCE_TYPE_CODE,
            C.AMNA_HOUSE_NUMBER_01 as BUILDING_NUMBER,
            C.AMNA_HOUSE_NAME_01 as BUILDING_NAME,
            cast(null as varchar) as STREET_NAME,
            C.AMNA_ADDR_1_01 as ADDRESS_LINE1,
            C.AMNA_ADDR_2_01 as ADDRESS_LINE2,
            C.AMNA_ADDR_3_01 as ADDRESS_LINE3,
            C.AMNA_ADDR_4_01 as ADDRESS_LINE4,
            C.AMNA_CITY_STATE_01 as TOWN_NAME,
            C.AMNA_STATE_01 as REGION,
            C.AMNA_PSTL_CD_01 as POSTAL_CODE,
            C.AMNA_DATE_LAST_MAINT as SOURCE_EFFECTIVE_FROM_DATETIME
        from DATAOPS_HUB_SHARE_VISION_NONPROD.ODS.CUSTOMER as C

        union all

        select
            C.AMNA_ACCT, 'HOME',
            C.AMNA_CNTRY_CD_02,
            'PREFERRED', C.AMNA_HOUSE_NUMBER_02, C.AMNA_HOUSE_NAME_02, cast(null as varchar),
            C.AMNA_ADDR_1_02, C.AMNA_ADDR_2_02, C.AMNA_ADDR_3_02, C.AMNA_ADDR_4_02,
            C.AMNA_CITY_STATE_02, C.AMNA_STATE_02, C.AMNA_PSTL_CD_02, C.AMNA_DATE_LAST_MAINT
        from DATAOPS_HUB_SHARE_VISION_NONPROD.ODS.CUSTOMER as C

        union all

        select
            C.AMNA_ACCT, 'BIZZ', null, 'NOCTCT',
            cast(null as varchar), cast(null as varchar), cast(null as varchar),
            C.AMNA_EMPLOYER_ADDR_1_01, C.AMNA_EMPLOYER_ADDR_2_01,
            cast(null as varchar), cast(null as varchar), cast(null as varchar),
            cast(null as varchar), cast(null as varchar), C.AMNA_DATE_LAST_MAINT
        from DATAOPS_HUB_SHARE_VISION_NONPROD.ODS.CUSTOMER as C

        union all

        select
            C.AMNA_ACCT, 'BIZZ', null, 'NOCTCT',
            cast(null as varchar), cast(null as varchar), cast(null as varchar),
            C.AMNA_EMPLOYER_ADDR_1_02, C.AMNA_EMPLOYER_ADDR_2_02,
            cast(null as varchar), cast(null as varchar), cast(null as varchar),
            cast(null as varchar), cast(null as varchar), C.AMNA_DATE_LAST_MAINT
        from DATAOPS_HUB_SHARE_VISION_NONPROD.ODS.CUSTOMER as C
    ),
    card_customer_lookup as (
        select CUSTOMER_ID, CARD_CUSTOMER_KEY, CARD_CUSTOMER_BUSINESS_KEY
        from {{ var("database") }}.CORE.{{ var("card_customer_table", "CARD_CUSTOMER") }}
        qualify row_number() over (partition by CUSTOMER_ID order by AUDIT_LAST_CHANGED_DATETIME desc nulls last, AUDIT_CREATED_DATETIME desc nulls last) = 1
    )
    select
        card_customer_lookup.CARD_CUSTOMER_KEY,
        card_customer_lookup.CARD_CUSTOMER_BUSINESS_KEY,
        address_rows.ADDRESS_TYPE_CODE,
        address_rows.ADDRESS_COUNTRY_SOURCE_CODE,
        address_rows.CUSTOMER_CONTACT_PREFERENCE_TYPE_CODE,
        address_rows.BUILDING_NUMBER,
        address_rows.BUILDING_NAME,
        address_rows.STREET_NAME,
        address_rows.ADDRESS_LINE1,
        address_rows.ADDRESS_LINE2,
        address_rows.ADDRESS_LINE3,
        address_rows.ADDRESS_LINE4,
        address_rows.TOWN_NAME,
        address_rows.REGION,
        address_rows.POSTAL_CODE,
        address_rows.SOURCE_EFFECTIVE_FROM_DATETIME
    from address_rows
    -- left join card_customer_lookup on card_customer_lookup.CUSTOMER_ID = address_rows.CUSTOMER_ID
    inner join card_customer_lookup on card_customer_lookup.CUSTOMER_ID = address_rows.CUSTOMER_ID

target:
  id: CARD_CUSTOMER_ADDRESS
  schema: CORE
  fields:
    - id: CARD_CUSTOMER_KEY
      source:
        column: CARD_CUSTOMER_KEY
      data_type: varchar(64)
      nullable: false
    - id: CARD_CUSTOMER_BUSINESS_KEY
      source:
        column: CARD_CUSTOMER_BUSINESS_KEY
      data_type: varchar(64)
      nullable: false
    - id: ADDRESS_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: ADDRESS_TYPE
          source_system: V10
          source_code_column: ADDRESS_TYPE_CODE
          required: true
      data_type: varchar(64)
      nullable: false
    - id: ADDRESS_COUNTRY_KEY
      source:
        macro: reference_lookup_core_macros.reference_lookup_core_bridge
        args:
          reference_type: COUNTRY
          source_code_expression: |
            case
              when trim(source_query.ADDRESS_COUNTRY_SOURCE_CODE) is null
                or trim(source_query.ADDRESS_COUNTRY_SOURCE_CODE) = '' then 'DQMissing'
              else trim(source_query.ADDRESS_COUNTRY_SOURCE_CODE)
            end
          code_column: COUNTRY_CODE
          value_column: COUNTRY_KEY
          required: true
      data_type: varchar(64)
      nullable: true
    - id: CUSTOMER_CONTACT_PREFERENCE_TYPE_KEY
      source:
        macro: reference_lookup_mapping_macros.reference_lookup_mapping_bridge
        args:
          reference_type: CUSTOMER_CONTACT_PREFERENCE_TYPE
          source_system: V10
          source_code_column: CUSTOMER_CONTACT_PREFERENCE_TYPE_CODE
          required: true
      data_type: varchar(64)
      nullable: false
    - id: BUILDING_NUMBER
      source:
        column: BUILDING_NUMBER
      data_type: varchar(100)
      nullable: true
    - id: BUILDING_NAME
      source:
        column: BUILDING_NAME
      data_type: varchar(100)
      nullable: true
    - id: STREET_NAME
      source:
        column: STREET_NAME
      data_type: varchar(100)
      nullable: true
    - id: ADDRESS_LINE1
      source:
        column: ADDRESS_LINE1
      data_type: varchar(100)
      nullable: true
    - id: ADDRESS_LINE2
      source:
        column: ADDRESS_LINE2
      data_type: varchar(100)
      nullable: true
    - id: ADDRESS_LINE3
      source:
        column: ADDRESS_LINE3
      data_type: varchar(100)
      nullable: true
    - id: ADDRESS_LINE4
      source:
        column: ADDRESS_LINE4
      data_type: varchar(100)
      nullable: true
    - id: TOWN_NAME
      source:
        column: TOWN_NAME
      data_type: varchar(100)
      nullable: true
    - id: REGION
      source:
        column: REGION
      data_type: varchar(100)
      nullable: true
    - id: POSTAL_CODE
      source:
        column: POSTAL_CODE
      data_type: varchar(100)
      nullable: true
